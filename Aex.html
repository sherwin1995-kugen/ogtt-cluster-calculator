<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OGTT Cluster Calculator — St. John's GDM Study</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Calibri,Arial,sans-serif;background:#F0F4FA;min-height:100vh;padding:16px 12px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media(max-width:600px){
  .g3{grid-template-columns:1fr 1fr!important}
  .g4{grid-template-columns:1fr 1fr!important}
  .g5{grid-template-columns:1fr 1fr!important}
  .gnav{gap:6px!important}
  .gnav button{padding:7px 10px!important;font-size:11px!important}
}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ================================================================
// ⚙️  CONFIGURATION — EDIT THESE TWO LINES BEFORE UPLOADING
// ================================================================
const SUPABASE_URL = "https://sbiqcybgbvdfylxgycfx.supabase.co";   // ← paste your URL here
const SUPABASE_KEY = "sb_publishable_XfyZdn5a_6iQtiXzfqiQ3A_gHuPoliQ";                 // ← paste your anon key here
// ================================================================

const {useState, useEffect, useCallback} = React;
const TABLE = "ogtt_cases";
const CONFIGURED = !SUPABASE_URL.includes("YOUR_PROJECT");

// ── Database helpers ─────────────────────────────────────────────
async function dbInsert(row) {
  if (!CONFIGURED) return localSave(row);
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(row)
    });
    return r.ok;
  } catch(e) { console.error(e); return false; }
}

async function dbFetch() {
  if (!CONFIGURED) return localLoad();
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc&limit=1000`,
      { headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` }}
    );
    if (!r.ok) return [];
    return r.json();
  } catch(e) { console.error(e); return []; }
}

// localStorage fallback when Supabase not configured
function localLoad() {
  try { return JSON.parse(localStorage.getItem("ogtt_cases")||"[]"); } catch { return []; }
}
function localSave(row) {
  try {
    const existing = localLoad();
    localStorage.setItem("ogtt_cases", JSON.stringify([...existing, row]));
    return true;
  } catch { return false; }
}

// ── Cluster model (St. John's n=245) ────────────────────────────
const NORM = {
  fbs:  {mean:82.1388, sd:10.4708},
  d1hr: {mean:54.4367, sd:30.9722},
  d2hr: {mean:32.1347, sd:23.9812},
};

const CLUSTERS = {
  0:{
    name:"CL", full:"Cluster Low", color:"#5E81A2", bg:"#EBF2F8",
    fbs_z:-0.661, d1_z:-0.701, d2_z:-0.629,
    fbs_raw:75.2, d1_raw:32.7, d2_raw:17.0,
    profile:"Low fasting · Low Δ1hr · Low Δ2hr",
    note:"Highest PIH despite lowest glucose — placental insufficiency phenotype",
    advice:"Monitor BP closely. Serial urine protein. Despite low glucose, vascular risk is highest in this cluster.",
    gdm_pct:38,
    pred:{
      all:  {HTN:16, PRETERM:9,  SGA:9,  LGA:7,  FD:9,  LSCS:29, IND:13, APO:72, MCO:13},
      gdm:  {HTN:19, PRETERM:6,  SGA:6,  LGA:6,  FD:6,  LSCS:38, IND:13, APO:75, MCO:13},
      nongdm:{HTN:15, PRETERM:10, SGA:10, LGA:7,  FD:10, LSCS:25, IND:14, APO:69, MCO:14},
    }
  },
  1:{
    name:"CS", full:"Cluster Spiker", color:"#D4835A", bg:"#FDF0EB",
    fbs_z:-0.327, d1_z:0.570, d2_z:0.875,
    fbs_raw:78.7, d1_raw:72.1, d2_raw:53.1,
    profile:"Normal fasting · High Δ1hr spike · Elevated Δ2hr",
    note:"LGA risk dominant. First-phase response high but clearance slow.",
    advice:"Target 1hr postprandial <140 mg/dL. Serial growth scans for macrosomia.",
    gdm_pct:31,
    pred:{
      all:  {HTN:18, PRETERM:10, SGA:8,  LGA:11, FD:11, LSCS:38, IND:15, APO:76, MCO:15},
      gdm:  {HTN:17, PRETERM:9,  SGA:4,  LGA:13, FD:9,  LSCS:48, IND:17, APO:78, MCO:17},
      nongdm:{HTN:18, PRETERM:10, SGA:10, LGA:9,  FD:13, LSCS:28, IND:13, APO:73, MCO:13},
    }
  },
  2:{
    name:"CF", full:"Cluster Fasting", color:"#6FA36F", bg:"#EEF6EE",
    fbs_z:0.799, d1_z:-0.238, d2_z:-0.472,
    fbs_raw:90.5, d1_raw:47.1, d2_raw:20.8,
    profile:"High fasting · Blunted Δ1hr · Low Δ2hr",
    note:"Paradoxically LOW PIH. Higher SGA. Fasting glucose is the primary management target.",
    advice:"Fasting is the key target. Evening snack, metformin or basal insulin. Watch for SGA on growth scans.",
    gdm_pct:54,
    pred:{
      all:  {HTN:5,  PRETERM:7,  SGA:13, LGA:5,  FD:7,  LSCS:46, IND:13, APO:80, MCO:13},
      gdm:  {HTN:3,  PRETERM:6,  SGA:15, LGA:3,  FD:6,  LSCS:55, IND:15, APO:85, MCO:18},
      nongdm:{HTN:7,  PRETERM:7,  SGA:11, LGA:7,  FD:7,  LSCS:36, IND:11, APO:75, MCO:7},
    }
  },
  3:{
    name:"CFS", full:"Cluster Fasting-Spiker", color:"#A06898", bg:"#F5EEF8",
    fbs_z:2.014, d1_z:2.045, d2_z:1.220,
    fbs_raw:103.2, d1_raw:117.8, d2_raw:61.4,
    profile:"High fasting · Very high Δ1hr · High Δ2hr",
    note:"Highest LGA, preterm, MCO. Lowest SGA. Highest treatment intensity needed.",
    advice:"Most intensive management. High insulin probability. Serial growth scans essential. Preterm risk — plan delivery timing.",
    gdm_pct:72,
    pred:{
      all:  {HTN:17, PRETERM:22, SGA:6,  LGA:28, FD:11, LSCS:61, IND:28, APO:89, MCO:33},
      gdm:  {HTN:15, PRETERM:23, SGA:4,  LGA:31, FD:12, LSCS:69, IND:31, APO:92, MCO:38},
      nongdm:{HTN:20, PRETERM:20, SGA:10, LGA:20, FD:10, LSCS:40, IND:20, APO:80, MCO:20},
    }
  },
};

const OUTCOMES = [
  {key:"htn",   label:"HTN / PIH"},
  {key:"preterm",label:"Preterm"},
  {key:"sga",   label:"SGA"},
  {key:"lga",   label:"LGA"},
  {key:"fd",    label:"Fetal Distress"},
  {key:"lscs",  label:"LSCS"},
  {key:"ind",   label:"Induction"},
];

const TREATMENTS = [
  {key:"tx_diet",     label:"Diet only"},
  {key:"tx_metformin",label:"Metformin"},
  {key:"tx_insulin",  label:"Insulin"},
  {key:"tx_antihtn",  label:"Antihypertensive"},
  {key:"tx_aspirin",  label:"Aspirin"},
];

const stdz = (v,m,s) => (v-m)/s;
const edist = (p,c) => Math.sqrt(
  Math.pow(p.fbs_z-c.fbs_z,2)+
  Math.pow(p.d1_z-c.d1_z,2)+
  Math.pow(p.d2_z-c.d2_z,2)
);

// ── Main App ─────────────────────────────────────────────────────
function App() {
  const [tab,    setTab]    = useState("calc");
  const [fbs,    setFbs]    = useState("");
  const [hr1,    setHr1]    = useState("");
  const [hr2,    setHr2]    = useState("");
  const [pid,    setPid]    = useState("");
  const [centre, setCentre] = useState("");
  const [isGdm,  setIsGdm]  = useState(null);
  const [result, setResult] = useState(null);
  const [outs,   setOuts]   = useState({});
  const [txs,    setTxs]    = useState({});
  const [cases,  setCases]  = useState([]);
  const [loading,setLoading]= useState(true);
  const [saving, setSaving] = useState(false);
  const [saved,  setSaved]  = useState(false);
  const [err,    setErr]    = useState("");
  const [saveErr,setSaveErr]= useState("");

  useEffect(() => {
    dbFetch().then(c => { setCases(c||[]); setLoading(false); });
  }, []);

  // ── Assign cluster ─────────────────────────────────────────────
  const assign = useCallback(() => {
    const f=parseFloat(fbs), h1=parseFloat(hr1), h2=parseFloat(hr2);
    if (isNaN(f)||isNaN(h1)||isNaN(h2)) { setErr("Please enter all three OGTT values."); return; }
    if (f<40||f>250||h1<50||h1>450||h2<50||h2>450) { setErr("Values out of plausible range — check units (mg/dL)."); return; }
    if (isGdm===null) { setErr("Please select GDM status before assigning."); return; }
    setErr(""); setSaved(false); setSaveErr(""); setOuts({}); setTxs({});
    const d1=h1-f, d2=h2-f;
    const pt = {
      fbs_z: stdz(f,  NORM.fbs.mean,  NORM.fbs.sd),
      d1_z:  stdz(d1, NORM.d1hr.mean, NORM.d1hr.sd),
      d2_z:  stdz(d2, NORM.d2hr.mean, NORM.d2hr.sd),
    };
    const dists = Object.entries(CLUSTERS)
      .map(([cid,c]) => ({cid:parseInt(cid), d:edist(pt,c)}))
      .sort((a,b) => a.d-b.d);
    const conf = ((dists[1].d-dists[0].d)/dists[1].d*100).toFixed(0);
    setResult({C:CLUSTERS[dists[0].cid], cid:dists[0].cid, d1,d2,dists,conf,pt,f,h1,h2,isGdm});
  }, [fbs,hr1,hr2,isGdm]);

  // ── Save case ──────────────────────────────────────────────────
  const saveCase = async () => {
    if (!result) return;
    setSaving(true); setSaveErr("");
    const apo = OUTCOMES.some(o => outs[o.key]===1);
    const mco = OUTCOMES
      .filter(o => !["lscs","ind"].includes(o.key))
      .filter(o => outs[o.key]===1).length >= 2;
    const row = {
      pid:     pid||"anon",
      centre:  centre||"unspecified",
      fbs:     result.f,
      hr1:     result.h1,
      hr2:     result.h2,
      d1hr:    parseFloat(result.d1.toFixed(1)),
      d2hr:    parseFloat(result.d2.toFixed(1)),
      fbs_z:   parseFloat(result.pt.fbs_z.toFixed(4)),
      d1_z:    parseFloat(result.pt.d1_z.toFixed(4)),
      d2_z:    parseFloat(result.pt.d2_z.toFixed(4)),
      cluster: result.C.name,
      cid:     result.cid,
      dist:    parseFloat(result.dists[0].d.toFixed(4)),
      conf:    parseInt(result.conf),
      is_gdm:  result.isGdm,
      has_outcomes: Object.keys(outs).length > 0,
      apo, mco,
      ...Object.fromEntries(OUTCOMES.map(o=>[o.key, outs[o.key]===1||false])),
      ...Object.fromEntries(TREATMENTS.map(t=>[t.key, !!txs[t.key]])),
      created_at: new Date().toISOString(),
    };
    const ok = await dbInsert(row);
    if (ok) { setCases(prev=>[row,...prev]); setSaved(true); }
    else setSaveErr("Save failed. Check your internet connection or Supabase configuration.");
    setSaving(false);
  };

  // ── Computed values ────────────────────────────────────────────
  const d1v = (fbs&&hr1&&!isNaN(+fbs)) ? (+hr1-+fbs).toFixed(1) : "—";
  const d2v = (fbs&&hr2&&!isNaN(+fbs)) ? (+hr2-+fbs).toFixed(1) : "—";
  const d12r = (d1v!=="—"&&d2v!=="—"&&+d2v!==0) ? (+d1v/+d2v).toFixed(2) : "—";

  const validCases = cases.filter(c=>c.has_outcomes);
  const byCid = {0:[],1:[],2:[],3:[]};
  validCases.forEach(c=>{ if(c.cid!==undefined) byCid[c.cid].push(c); });

  // ── Inline styles ──────────────────────────────────────────────
  const card  = {background:"#fff",borderRadius:12,padding:"16px 18px",boxShadow:"0 1px 6px rgba(0,0,0,0.08)",marginBottom:14};
  const inp   = {width:"100%",padding:"9px 11px",border:"1.5px solid #C5D5EA",borderRadius:7,fontSize:15,fontWeight:700,color:"#1F3864",background:"#F4F8FF",outline:"none",boxSizing:"border-box"};
  const lbl   = {fontSize:11,fontWeight:600,color:"#555",marginBottom:5,display:"block"};
  const btn   = (col,sm,dis) => ({padding:sm?"8px 14px":"11px 0",background:dis?"#bbb":col||"#1F3864",color:"#fff",border:"none",borderRadius:8,fontSize:sm?12:14,fontWeight:700,cursor:dis?"not-allowed":"pointer",width:sm?"auto":"100%",opacity:dis?0.7:1});
  const tog   = (active,col) => ({padding:"9px 11px",border:`2px solid ${active?col:"#ddd"}`,borderRadius:8,background:active?col+"20":"#fafafa",color:active?col:"#aaa",fontWeight:700,fontSize:12,cursor:"pointer",textAlign:"center",transition:"all 0.12s"});
  const tabS  = (a) => ({padding:"9px 14px",border:"none",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer",background:a?"#1F3864":"#E2E8F4",color:a?"#fff":"#555"});

  return(
    <div style={{maxWidth:820,margin:"0 auto"}}>

      {/* ── HEADER ── */}
      <div style={{background:"#1F3864",borderRadius:12,padding:"15px 18px",marginBottom:14}}>
        <div style={{color:"#fff",fontSize:18,fontWeight:800}}>
          OGTT Cluster Calculator
        </div>
        <div style={{color:"#B0C8F0",fontSize:11,marginTop:4}}>
          St. John's Medical College Hospital · GDM Phenotyping Study · n=245
          &nbsp;·&nbsp;
          {CONFIGURED
            ? <span style={{color:"#90EE90"}}>✓ Connected to central database · {loading?"...":cases.length} cases</span>
            : <span style={{color:"#FFD700"}}>⚠ Local mode — configure Supabase for multi-centre use</span>
          }
        </div>
      </div>

      {/* ── TABS ── */}
      <div className="gnav" style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {[["calc","🧮 Assign"],["validate","📊 Validate"],["data","🗄 Data"],["ref","📋 Reference"]].map(([id,lbl2])=>(
          <button key={id} style={tabS(tab===id)} onClick={()=>setTab(id)}>{lbl2}</button>
        ))}
      </div>

      {/* ══════════════════════════════════════════════════════════
          TAB 1 — CALCULATOR
      ══════════════════════════════════════════════════════════ */}
      {tab==="calc"&&(
        <div>
          <div style={card}>
            <div style={{fontWeight:700,color:"#1F3864",fontSize:15,marginBottom:14}}>
              Patient Details
            </div>

            {/* Centre + ID */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
              <div>
                <label style={lbl}>Centre / Hospital *</label>
                <input value={centre} onChange={e=>setCentre(e.target.value)}
                  placeholder="e.g. St. John's, Muller's" style={inp}/>
              </div>
              <div>
                <label style={lbl}>Patient ID (optional — no names)</label>
                <input value={pid} onChange={e=>setPid(e.target.value)}
                  placeholder="IP number / Study ID" style={inp}/>
              </div>
            </div>

            {/* GDM status */}
            <label style={lbl}>GDM Status <span style={{color:"#B00020"}}>*</span>
              <span style={{color:"#888",fontWeight:400,marginLeft:6}}>
                (changes predicted outcome rates)
              </span>
            </label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
              {[[true,"✓  GDM Diagnosed","#D4835A"],[false,"✗  Non-GDM (below IADPSG)","#5E81A2"]].map(([v,l,c])=>(
                <button key={String(v)} style={tog(isGdm===v,c)} onClick={()=>setIsGdm(v)}>{l}</button>
              ))}
            </div>

            {/* OGTT values */}
            <label style={lbl}>75g OGTT Values (mg/dL)</label>
            <div className="g3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
              {[["FBS (Fasting)",fbs,setFbs,"e.g. 85"],
                ["1hr Glucose",hr1,setHr1,"e.g. 148"],
                ["2hr Glucose",hr2,setHr2,"e.g. 130"]].map(([l,v,s,ph])=>(
                <div key={l}>
                  <div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{l}</div>
                  <input value={v} onChange={e=>s(e.target.value)} placeholder={ph}
                    type="number" style={inp}/>
                </div>
              ))}
            </div>

            {/* Derived values */}
            <div className="g3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
              {[["Δ1hr (1hr−FBS)",d1v],["Δ2hr (2hr−FBS)",d2v],["Δ1hr : Δ2hr",d12r]].map(([l,v])=>(
                <div key={l} style={{background:"#EBF2F8",borderRadius:7,padding:"8px 10px"}}>
                  <div style={{fontSize:10,fontWeight:600,color:"#555"}}>{l}</div>
                  <div style={{fontSize:16,fontWeight:800,color:"#1F3864"}}>{v}</div>
                </div>
              ))}
            </div>

            {err&&<div style={{color:"#B00020",fontSize:12,marginBottom:10,padding:"8px 12px",background:"#FFF0F0",borderRadius:6}}>{err}</div>}
            <button onClick={assign} style={btn()}>Assign to Cluster →</button>
          </div>

          {/* ── RESULT ── */}
          {result&&(()=>{
            const {C,cid,d1,d2,dists,conf,f,h1,h2,isGdm:gdm} = result;
            const predSet = gdm ? C.pred.gdm : C.pred.nongdm;
            return(
              <div>
                {/* Banner */}
                <div style={{background:C.color,borderRadius:12,padding:"16px 18px",marginBottom:12,color:"#fff"}}>
                  <div style={{fontSize:11,opacity:0.8,marginBottom:3}}>
                    {gdm?"GDM":"Non-GDM"} Patient · Assigned to
                  </div>
                  <div style={{fontSize:24,fontWeight:900,letterSpacing:0.5}}>
                    {C.name} — {C.full}
                  </div>
                  <div style={{fontSize:12,opacity:0.85,marginTop:5}}>{C.profile}</div>
                  <div style={{fontSize:11,opacity:0.75,marginTop:3}}>
                    Distance: {dists[0].d.toFixed(3)} · Confidence: {conf}% margin over next cluster
                  </div>
                </div>

                {/* Distance bars */}
                <div style={card}>
                  <div style={{fontWeight:700,color:"#1F3864",fontSize:13,marginBottom:10}}>
                    Distance to All Cluster Centroids
                  </div>
                  {dists.map(({cid:c2,d},i)=>{
                    const CC=CLUSTERS[c2];
                    const maxD=dists[dists.length-1].d;
                    return(
                      <div key={c2} style={{marginBottom:9}}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:2}}>
                          <span style={{fontWeight:i===0?700:400,color:i===0?CC.color:"#666"}}>
                            {i===0?"★ ":""}{CC.name} — {CC.full}
                            {i===0&&<span style={{fontSize:10,background:CC.color,color:"#fff",
                              borderRadius:4,padding:"1px 5px",marginLeft:6}}>ASSIGNED</span>}
                          </span>
                          <span style={{fontWeight:700,color:i===0?CC.color:"#aaa"}}>{d.toFixed(3)}</span>
                        </div>
                        <div style={{height:6,background:"#EEE",borderRadius:3}}>
                          <div style={{width:`${Math.max(3,(1-d/maxD)*100)}%`,height:"100%",
                                       background:i===0?CC.color:"#ccc",borderRadius:3}}/>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Predicted outcomes */}
                <div style={card}>
                  <div style={{fontWeight:700,color:"#1F3864",fontSize:13}}>
                    Predicted Outcome Rates — {gdm?"GDM":"Non-GDM"} subgroup of {C.name}
                  </div>
                  <div style={{fontSize:11,color:"#888",margin:"4px 0 12px"}}>
                    From St. John's training data · Raw rates (not treatment-adjusted) ·
                    {gdm
                      ? ` ${C.gdm_pct}% of this cluster were GDM in training cohort`
                      : ` ${100-C.gdm_pct}% of this cluster were Non-GDM in training cohort`
                    }
                  </div>
                  <div className="g4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:8}}>
                    {[...OUTCOMES,{key:"APO",label:"APO Extended"},{key:"MCO",label:"MCO"}].map(({key,label})=>{
                      const pct = predSet[key.toUpperCase()]||predSet[key]||0;
                      const col = pct>40?"#B83232":pct>20?"#C07000":"#2E7D32";
                      return(
                        <div key={key} style={{background:"#FAFAFA",borderRadius:7,padding:"8px 9px",
                                               borderLeft:`3px solid ${col}`}}>
                          <div style={{fontSize:10,color:"#555",fontWeight:600}}>{label}</div>
                          <div style={{fontSize:17,fontWeight:800,color:col}}>{pct}%</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{background:"#FFF8E1",borderRadius:6,padding:"7px 10px",fontSize:11,color:"#7B4400"}}>
                    <b>Note:</b> Rates are raw observed frequencies from the training cohort,
                    not adjusted for treatment. Treatment data collected below enables future
                    treatment-adjusted validation analysis.
                  </div>
                </div>

                {/* Clinical note */}
                <div style={{...card,background:C.bg,border:`1.5px solid ${C.color}`}}>
                  <div style={{fontWeight:700,color:C.color,fontSize:13,marginBottom:6}}>
                    {C.name} — Clinical Guidance
                  </div>
                  <div style={{fontSize:13,color:"#333",marginBottom:6,lineHeight:1.6}}>{C.note}</div>
                  <div style={{fontSize:13,color:"#444",lineHeight:1.6,fontStyle:"italic"}}>{C.advice}</div>
                </div>

                {/* Outcomes + Treatment entry */}
                <div style={card}>
                  <div style={{fontWeight:700,color:"#1F3864",fontSize:13,marginBottom:12}}>
                    Record for Validation Database
                    <span style={{fontSize:11,color:"#888",fontWeight:400,marginLeft:8}}>
                      (enter after delivery / outcomes known)
                    </span>
                  </div>

                  <label style={lbl}>Actual Outcomes — tap to mark YES</label>
                  <div className="g4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
                    {OUTCOMES.map(({key,label})=>(
                      <button key={key} style={tog(outs[key]===1,C.color)}
                              onClick={()=>setOuts(p=>({...p,[key]:p[key]===1?0:1}))}>
                        {outs[key]===1?"✓ ":""}{label}
                      </button>
                    ))}
                  </div>

                  {/* Auto-computed APO/MCO */}
                  {Object.keys(outs).length>0&&(()=>{
                    const apo=OUTCOMES.some(o=>outs[o.key]===1);
                    const mco=OUTCOMES.filter(o=>!["lscs","ind"].includes(o.key)).filter(o=>outs[o.key]===1).length>=2;
                    return(
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                        {[["APO Extended (any 1 of 7)",apo,"#1F3864"],["MCO (≥2 clinical events)",mco,"#B83232"]].map(([l,v,col])=>(
                          <div key={l} style={{background:v?"#FFF0F0":"#F0FFF0",borderRadius:7,
                                               padding:"8px 10px",border:`1.5px solid ${v?col:"#ccc"}`}}>
                            <div style={{fontSize:10,fontWeight:600,color:"#555"}}>{l}</div>
                            <div style={{fontSize:15,fontWeight:800,color:v?col:"#2E7D32"}}>
                              {v?"YES ✓":"NO ✗"}
                            </div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}

                  <label style={{...lbl,marginTop:4}}>Treatment Received — tap to mark YES</label>
                  <div className="g5" style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}}>
                    {TREATMENTS.map(({key,label})=>(
                      <button key={key} style={tog(!!txs[key],"#2E7D32")}
                              onClick={()=>setTxs(p=>({...p,[key]:!p[key]}))}>
                        {txs[key]?"✓ ":""}{label}
                      </button>
                    ))}
                  </div>

                  {saveErr&&<div style={{color:"#B00020",fontSize:12,marginBottom:8,
                    padding:"7px 10px",background:"#FFF0F0",borderRadius:6}}>{saveErr}</div>}

                  <div style={{display:"flex",gap:10}}>
                    <button onClick={saveCase} disabled={saving||saved}
                      style={{...btn(saved?"#2E7D32":"#1F3864",false,saving||saved),flex:1}}>
                      {saving?"Saving...":saved?"✓ Saved to Database":"Save to Validation Database"}
                    </button>
                    <button onClick={()=>{setResult(null);setFbs("");setHr1("");setHr2("");
                      setPid("");setOuts({});setTxs({});setSaved(false);setIsGdm(null);}}
                      style={btn("#888",true,false)}>
                      New Patient
                    </button>
                  </div>
                  {saved&&(
                    <div style={{color:"#2E7D32",fontSize:12,marginTop:8,textAlign:"center"}}>
                      Case saved · {cases.length} total cases in database
                    </div>
                  )}
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* ══════════════════════════════════════════════════════════
          TAB 2 — VALIDATION
      ══════════════════════════════════════════════════════════ */}
      {tab==="validate"&&(
        <div>
          {/* Summary cards */}
          <div style={card}>
            <div style={{fontWeight:700,color:"#1F3864",fontSize:14,marginBottom:12}}>
              Validation Summary
            </div>
            <div className="g4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
              {[
                ["Total cases",cases.length,"#1F3864"],
                ["With outcomes",validCases.length,"#2E7D32"],
                ["GDM",cases.filter(c=>c.is_gdm===true).length,"#D4835A"],
                ["Non-GDM",cases.filter(c=>c.is_gdm===false).length,"#5E81A2"],
              ].map(([l,v,col])=>(
                <div key={l} style={{background:"#F8F8F8",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#888",fontWeight:600}}>{l}</div>
                  <div style={{fontSize:22,fontWeight:800,color:col}}>{v}</div>
                </div>
              ))}
            </div>
            {cases.length>0&&(()=>{
              const centres=[...new Set(cases.map(c=>c.centre).filter(Boolean))];
              return centres.length>0&&(
                <div style={{marginTop:12,fontSize:12,color:"#555"}}>
                  <b>Contributing centres:</b> {centres.join(" · ")}
                </div>
              );
            })()}
          </div>

          {/* Per-cluster validation */}
          {validCases.length===0?(
            <div style={{...card,textAlign:"center",padding:"32px",color:"#aaa"}}>
              <div style={{fontSize:32,marginBottom:10}}>📊</div>
              <div style={{fontWeight:700,fontSize:14,color:"#666"}}>No outcome data yet</div>
              <div style={{fontSize:12,marginTop:6}}>
                Assign patients and record their outcomes in the Calculator tab.
                Validation statistics appear here automatically.
              </div>
            </div>
          ):(
            [0,1,2,3].map(cid=>{
              const C=CLUSTERS[cid];
              const pts=byCid[cid];
              if(!pts.length) return(
                <div key={cid} style={{...card,borderLeft:`4px solid ${C.color}`,opacity:0.5}}>
                  <span style={{fontWeight:700,color:C.color}}>{C.name} — {C.full}</span>
                  <span style={{fontSize:12,color:"#aaa",marginLeft:10}}>No cases yet</span>
                </div>
              );
              const gdmPts=pts.filter(p=>p.is_gdm===true);
              const ngPts=pts.filter(p=>p.is_gdm===false);
              return(
                <div key={cid} style={{...card,borderLeft:`4px solid ${C.color}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <div>
                      <div style={{fontWeight:700,color:C.color,fontSize:14}}>{C.name} — {C.full}</div>
                      <div style={{fontSize:12,color:"#888"}}>
                        n={pts.length} · GDM={gdmPts.length} · Non-GDM={ngPts.length}
                      </div>
                    </div>
                  </div>
                  <div className="g4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                    {[...OUTCOMES,{key:"APO",label:"APO Extended"}].map(({key,label})=>{
                      const k=key.toLowerCase();
                      const pred=C.pred.all[key.toUpperCase()]||C.pred.all[key]||0;
                      const act=pts.filter(p=>p[k]===true||p[k]===1).length/pts.length*100;
                      const diff=Math.abs(act-pred);
                      const col=diff<10?"#2E7D32":diff<20?"#C07000":"#B83232";
                      const icon=diff<10?"✓":diff<20?"≈":"✗";
                      return(
                        <div key={key} style={{background:"#FAFAFA",borderRadius:7,padding:"8px 9px"}}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                            <span style={{fontSize:10,fontWeight:600,color:"#555"}}>{label}</span>
                            <span style={{fontSize:10,fontWeight:700,color:col}}>{icon}</span>
                          </div>
                          <div style={{fontSize:11,color:"#888",marginBottom:3}}>Predicted</div>
                          <div style={{height:5,background:"#EEE",borderRadius:3,marginBottom:1}}>
                            <div style={{width:`${pred}%`,height:"100%",background:"#90B0D0",borderRadius:3}}/>
                          </div>
                          <div style={{fontSize:12,fontWeight:700,color:"#5E81A2",marginBottom:4}}>{pred}%</div>
                          <div style={{fontSize:11,color:"#888",marginBottom:3}}>Actual (n={pts.length})</div>
                          <div style={{height:5,background:"#EEE",borderRadius:3,marginBottom:1}}>
                            <div style={{width:`${act}%`,height:"100%",background:col,borderRadius:3}}/>
                          </div>
                          <div style={{fontSize:12,fontWeight:700,color:col}}>{act.toFixed(0)}%</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })
          )}

          <div style={{...card,background:"#FFF8E1",border:"1px solid #F9A825",fontSize:12,color:"#555"}}>
            <b>Interpretation:</b>&nbsp;
            ✓ = predicted and actual within 10% (good fit) &nbsp;
            ≈ = within 20% (acceptable) &nbsp;
            ✗ = &gt;20% difference (population may differ — consider retraining).<br/>
            Target for meaningful update: ≥30 cases per cluster (≥120 total).
            Current: <b>{cases.length}</b>. Still needed: <b>{Math.max(0,120-cases.length)}</b>.
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════════════════════════
          TAB 3 — DATA
      ══════════════════════════════════════════════════════════ */}
      {tab==="data"&&(
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                       marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{fontWeight:700,color:"#1F3864",fontSize:14}}>
              All Stored Cases (n={cases.length})
            </div>
            <button onClick={()=>{
              const hdrs=["#","centre","pid","date","fbs","hr1","hr2","d1hr","d2hr","cluster","gdm","conf",
                ...OUTCOMES.map(o=>o.key),"apo","mco",...TREATMENTS.map(t=>t.key)];
              const rows=cases.map((c,i)=>[cases.length-i,c.centre,c.pid,
                c.created_at?.slice(0,10),c.fbs,c.hr1,c.hr2,c.d1hr,c.d2hr,
                c.cluster,c.is_gdm?"GDM":"Non-GDM",c.conf,
                ...OUTCOMES.map(o=>c[o.key]===true?"1":"0"),
                c.apo?"1":"0",c.mco?"1":"0",
                ...TREATMENTS.map(t=>c[t.key]===true?"1":"0")]);
              const csv=[hdrs,...rows].map(r=>r.join(",")).join("\n");
              const a=document.createElement("a");
              a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
              a.download=`ogtt_cases_${new Date().toISOString().slice(0,10)}.csv`;
              a.click();
            }} style={{...btn("#2E7D32",true,false)}}>
              ↓ Export CSV
            </button>
          </div>
          {cases.length===0?(
            <div style={{textAlign:"center",padding:24,color:"#aaa",fontSize:13}}>
              No cases yet. Assign patients in the Calculator tab.
            </div>
          ):(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead>
                  <tr style={{background:"#1F3864"}}>
                    {["#","Centre","ID","Date","FBS","Δ1hr","Δ2hr","Cluster","GDM","Conf","Outcomes","Treatment"].map(h=>(
                      <th key={h} style={{padding:"7px 8px",color:"#fff",textAlign:"left",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {cases.map((c,i)=>{
                    const CC=CLUSTERS[c.cid];
                    const outList=OUTCOMES.filter(o=>c[o.key]===true).map(o=>o.label);
                    const txList=TREATMENTS.filter(t=>c[t.key]===true).map(t=>t.label.split(" ")[0]);
                    return(
                      <tr key={i} style={{background:i%2===0?"#FAFAFA":"#fff"}}>
                        <td style={{padding:"5px 8px",color:"#aaa"}}>{i+1}</td>
                        <td style={{padding:"5px 8px",fontWeight:600}}>{c.centre||"—"}</td>
                        <td style={{padding:"5px 8px"}}>{c.pid||"—"}</td>
                        <td style={{padding:"5px 8px",color:"#888",whiteSpace:"nowrap"}}>{c.created_at?.slice(0,10)||"—"}</td>
                        <td style={{padding:"5px 8px"}}>{c.fbs}</td>
                        <td style={{padding:"5px 8px"}}>{c.d1hr}</td>
                        <td style={{padding:"5px 8px"}}>{c.d2hr}</td>
                        <td style={{padding:"5px 8px",fontWeight:700,color:CC?.color||"#333"}}>{c.cluster}</td>
                        <td style={{padding:"5px 8px",color:c.is_gdm?"#D4835A":"#5E81A2",fontWeight:600}}>
                          {c.is_gdm===true?"GDM":c.is_gdm===false?"Non-GDM":"—"}
                        </td>
                        <td style={{padding:"5px 8px"}}>{c.conf}%</td>
                        <td style={{padding:"5px 8px",color:outList.length?"#B83232":"#aaa",
                                    fontStyle:!outList.length?"italic":"normal"}}>
                          {outList.length?outList.join(", "):"pending"}
                        </td>
                        <td style={{padding:"5px 8px",color:"#2E7D32"}}>
                          {txList.length?txList.join(", "):"—"}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {/* ══════════════════════════════════════════════════════════
          TAB 4 — REFERENCE
      ══════════════════════════════════════════════════════════ */}
      {tab==="ref"&&(
        <div>
          <div style={card}>
            <div style={{fontWeight:700,color:"#1F3864",fontSize:14,marginBottom:14}}>
              Cluster Reference — Centroids and Predicted Rates
            </div>
            {[0,1,2,3].map(cid=>{
              const C=CLUSTERS[cid];
              return(
                <div key={cid} style={{marginBottom:14,borderLeft:`4px solid ${C.color}`,
                                       paddingLeft:12}}>
                  <div style={{fontWeight:800,color:C.color,fontSize:15}}>{C.name} — {C.full}</div>
                  <div style={{fontSize:12,color:"#555",margin:"4px 0"}}>{C.profile}</div>
                  <div style={{fontSize:11,color:"#888",marginBottom:8}}>{C.note}</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
                    {[["FBS centroid",C.fbs_raw+" mg/dL"],
                      ["Δ1hr centroid",C.d1_raw+" mg/dL"],
                      ["Δ2hr centroid",C.d2_raw+" mg/dL"]].map(([l,v])=>(
                      <div key={l} style={{background:C.bg,borderRadius:7,padding:"7px 9px"}}>
                        <div style={{fontSize:10,color:"#555",fontWeight:600}}>{l}</div>
                        <div style={{fontSize:14,fontWeight:800,color:C.color}}>{v}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                    {[["All",C.pred.all],["GDM",C.pred.gdm],["Non-GDM",C.pred.nongdm]].map(([grp,pred])=>(
                      <div key={grp} style={{background:"#FAFAFA",borderRadius:7,padding:"8px 10px"}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#333",marginBottom:6}}>
                          {grp} subgroup
                        </div>
                        {[...OUTCOMES,{key:"APO",label:"APO"},{key:"MCO",label:"MCO"}].map(({key,label})=>(
                          <div key={key} style={{display:"flex",justifyContent:"space-between",
                                                  fontSize:11,padding:"2px 0",borderBottom:"1px solid #F0F0F0"}}>
                            <span style={{color:"#666"}}>{label}</span>
                            <span style={{fontWeight:700,
                              color:(pred[key.toUpperCase()]||pred[key]||0)>30?"#B83232":"#2E7D32"}}>
                              {pred[key.toUpperCase()]||pred[key]||0}%
                            </span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{...card,background:"#EBF2F8"}}>
            <div style={{fontWeight:700,color:"#1F3864",fontSize:13,marginBottom:8}}>
              Assignment Method
            </div>
            <div style={{fontSize:12,color:"#444",lineHeight:1.8}}>
              <b>Step 1:</b> Compute Δ1hr = 1hr − FBS, Δ2hr = 2hr − FBS<br/>
              <b>Step 2:</b> Standardise using training data parameters:<br/>
              &nbsp;&nbsp;FBS_z = (FBS − 82.14) / 10.47<br/>
              &nbsp;&nbsp;Δ1hr_z = (Δ1hr − 54.44) / 30.97<br/>
              &nbsp;&nbsp;Δ2hr_z = (Δ2hr − 32.13) / 23.98<br/>
              <b>Step 3:</b> Calculate Euclidean distance to each centroid in standardised space<br/>
              <b>Step 4:</b> Assign to nearest centroid<br/><br/>
              <b>Training cohort:</b> n=245 (GDM=59, Non-GDM=186), St. John's Medical College Hospital, Bengaluru<br/>
              <b>Algorithm:</b> k-means clustering (k=4, 100 initialisations, random seed=42)<br/>
              <b>Input features:</b> FBS + Δ1hr + Δ2hr (orthogonal glycaemic kinetic features)
            </div>
          </div>
        </div>
      )}

      <div style={{textAlign:"center",fontSize:10,color:"#aaa",padding:"10px 0 4px"}}>
        St. John's Medical College Hospital · Dept of Endocrinology · GDM Phenotyping Study · Research use only
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
